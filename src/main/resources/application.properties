spring.application.name=librarymanagement

# Banco de dados (os valores padrão batem com o docker-compose.yml)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Regras da biblioteca
library.loan-days=14
library.rare-loan-days=7
library.fine-per-day=1.00

# Origens liberadas para o front-end
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
