spring.application.name=librarymanagement

# Os testes usam um banco H2 em memória, no modo de compatibilidade com PostgreSQL
spring.datasource.url=jdbc:h2:mem:library;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

library.loan-days=14
library.rare-loan-days=7
library.fine-per-day=1.00

app.cors.allowed-origins=http://localhost:5173
